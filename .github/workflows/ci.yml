name: Update GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compile code and slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile code module
        shell: bash
        run: |
          set +e
          sbt -Dsbt.color=false code/compile 2>&1 | tee /tmp/sbt.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -E '^\[error\]' /tmp/sbt.log | head -40 | awk '{printf "%s%%0A", $0}')
            echo "::error title=sbt code/compile::$msg"
          fi
          exit $rc
      - name: Render slides with mdoc
        shell: bash
        run: |
          set +e
          sbt -Dsbt.color=false mdoc 2>&1 | tee /tmp/sbt.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -E '^\[error\]' /tmp/sbt.log | head -40 | awk '{printf "%s%%0A", $0}')
            echo "::error title=sbt mdoc::$msg"
          fi
          exit $rc

  github-pages:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish
        shell: bash
        run: |
          set +e
          sbt -Dsbt.color=false mdoc publishToGitHubPages 2>&1 | tee /tmp/sbt.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -E '^\[(error|warn)\]' /tmp/sbt.log | head -40 | awk '{printf "%s%%0A", $0}')
            echo "::error title=sbt publishToGitHubPages::$msg"
          fi
          exit $rc
        env:
          GITHUB_TOKEN: ${{ github.token }}
