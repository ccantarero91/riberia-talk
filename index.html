<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>Riberia: wine recommendations with RAG in Scala</title>
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight/monokai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/blood.css">
  <base target="_blank">
  <style>
    .intro { display: flex; align-items: center; justify-content: center; gap: 50px; }
    .reveal .intro img.avatar { width: 260px; height: 260px; border-radius: 50%; border: 4px solid #ff6b6b; margin: 0; }
    .reveal ul.plain { list-style: none; margin: 0; text-align: left; font-size: 0.85em; }
    .reveal ul.plain li { margin: 14px 0; }
    .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 30px; }
    .card { width: 240px; padding: 18px 12px; border: 2px solid #e6e6e6; border-radius: 14px; font-size: 0.6em; }
    .card.hot { border-color: #ff6b6b; }
    .card .big { display: block; font-size: 2.6em; margin-bottom: 8px; }
    .card b { display: block; font-size: 1.3em; margin-bottom: 6px; }
    .reveal .card code { font-size: 1.4em; color: #ff6b6b; }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="riberia.md" data-separator="^\n\n\n" data-separator-vertical="^---"
        data-separator-notes="^Note:"></section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
  <script>Reveal.initialize(
      {
        hash: true,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
        slideNumber: 'c/t',
        showSlideNumber: 'speaker',
        scroll: true, // Activa el desplazamiento vertical
      });</script>
</body>

</html>
