text x="635.0" y="250" fill="#e6e6e6" font-size="20" font-weight="bold" text-anchor="middle">Answer model *</text><text x="635.0" y="276" fill="#bbb" font-size="16" text-anchor="middle">writes the answer</text><text x="635.0" y="298" fill="#bbb" font-size="16" text-anchor="middle">(here: reads the</text><text x="635.0" y="320" fill="#bbb" font-size="16" text-anchor="middle">wine-list photo)</text><line x1="190" y1="185" x2="300" y2="80" stroke="#e6e6e6" stroke-width="2.5" marker-end="url(#a0)"/><line x1="190" y1="215" x2="300" y2="280" stroke="#e6e6e6" stroke-width="2.5" marker-end="url(#a0)"/><line x1="420" y1="220" x2="420" y2="142" stroke="#e6e6e6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a0)"/><text x="10" y="400" fill="#bbb" font-size="15">* explained later, in the image part</text></svg>