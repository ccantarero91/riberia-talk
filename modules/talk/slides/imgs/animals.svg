<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="360" x2="610" y2="360" stroke="#e6e6e6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="70" y1="360" x2="70" y2="30" stroke="#e6e6e6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- axis labels -->
  <text x="190" y="395" fill="#e6e6e6" font-size="22" text-anchor="middle">cat</text>
  <text x="490" y="395" fill="#e6e6e6" font-size="22" text-anchor="middle">dog</text>
  <text x="340" y="415" fill="#9a9a9a" font-size="16" text-anchor="middle">axis 1: animal</text>
  <text x="58" y="55" fill="#e6e6e6" font-size="22" text-anchor="end">white</text>
  <text x="58" y="335" fill="#e6e6e6" font-size="22" text-anchor="end">black</text>
  <text x="22" y="200" fill="#9a9a9a" font-size="16" text-anchor="middle" transform="rotate(-90 22 200)">axis 2: colour</text>

  <!-- points -->
  <g font-size="44" text-anchor="middle">
    <circle cx="190" cy="90"  r="42" fill="#f4f4f4"/>
    <text x="190" y="105">🐱</text>
    <circle cx="190" cy="280" r="42" fill="#1c1c1c" stroke="#e6e6e6" stroke-width="2"/>
    <text x="190" y="295">🐱</text>
    <circle cx="490" cy="90"  r="42" fill="#f4f4f4"/>
    <text x="490" y="105">🐶</text>
    <circle cx="490" cy="280" r="42" fill="#1c1c1c" stroke="#e6e6e6" stroke-width="2"/>
    <text x="490" y="295">🐶</text>
  </g>

  <!-- captions -->
  <g font-size="16" fill="#e6e6e6" text-anchor="middle">
    <text x="190" y="150">white cat</text>
    <text x="190" y="340">black cat</text>
    <text x="490" y="150">white dog</text>
    <text x="490" y="340">black dog</text>
  </g>
</svg>
